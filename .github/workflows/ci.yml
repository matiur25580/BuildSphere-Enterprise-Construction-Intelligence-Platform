name: BuildSphere CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}] }).ok }'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: Build API and web workspaces
        run: npm run build
      - name: Run API unit and MongoDB integration tests
        run: npm test --workspace=@buildsphere/api
        env:
          OUTBOX_TRANSACTION_MODE: required
          JWT_ACCESS_SECRET: buildsphere-ci-secret-that-is-at-least-32-characters-long
          MONGODB_URI: mongodb://127.0.0.1:27017/buildsphere_ci?replicaSet=rs0

      - name: Build production API container
        run: docker build -t buildsphere-api:ci .
