name: BuildSphere CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/production-auth-readiness-hardening, feat/distributed-document-storage, feat/resumable-document-uploads, feat/document-upload-lifecycle-cleanup]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Start MongoDB replica set
        run: |
          docker run -d --name buildsphere-mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec buildsphere-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec buildsphere-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec buildsphere-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not become writable primary" >&2
          exit 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: Build API and web workspaces
        run: npm run build
      - name: Run API unit and MongoDB integration tests
        run: npm test --workspace=@buildsphere/api
        env:
          OUTBOX_TRANSACTION_MODE: required
          JWT_ACCESS_SECRET: buildsphere-ci-secret-that-is-at-least-32-characters-long
          MONGODB_URI: mongodb://127.0.0.1:27017/buildsphere_ci?replicaSet=rs0

      - name: Build production API container
        run: docker build -t buildsphere-api:ci .
