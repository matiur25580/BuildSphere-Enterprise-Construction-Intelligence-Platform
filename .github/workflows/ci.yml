name: BuildSphere CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: buildsphere-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start MongoDB replica set
        run: |
          docker run -d --name buildsphere-mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec buildsphere-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec buildsphere-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec buildsphere-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not become writable primary" >&2
          exit 1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm ci
      - name: Install pinned ESLint tooling
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts --no-audit
          eslint@10.15.0 @eslint/js@10.0.1 typescript-eslint@8.70.0
          eslint-plugin-react-hooks@7.1.1 eslint-plugin-react-refresh@0.5.8 globals@16.5.0
          @playwright/test@1.56.1
      - name: Run web ESLint
        run: npm run lint --workspace=@buildsphere/web
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build API and web workspaces
        run: npm run build
      - name: Run web unit tests
        run: npm test --workspace=@buildsphere/web
      - name: Run API unit and MongoDB integration tests
        run: npm test --workspace=@buildsphere/api
        env:
          OUTBOX_TRANSACTION_MODE: required
          JWT_ACCESS_SECRET: buildsphere-ci-secret-that-is-at-least-32-characters-long
          MONGODB_URI: mongodb://127.0.0.1:27017/buildsphere_ci?replicaSet=rs0
      - name: Install Chromium for browser E2E
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e
        env:
          NODE_ENV: development
          JWT_ACCESS_SECRET: buildsphere-ci-secret-that-is-at-least-32-characters-long
          MONGODB_URI: mongodb://127.0.0.1:27017/buildsphere_e2e?replicaSet=rs0
          CLIENT_URL: http://127.0.0.1:5173
          DOCUMENT_STORAGE_PROVIDER: local
          DOCUMENT_STORAGE_DIR: /tmp/buildsphere-e2e-documents
          VITE_API_URL: http://127.0.0.1:5000/api/v1
      - name: Build production API container
        run: docker build -t buildsphere-api:ci .
