name: Bootstrap npm lockfile

on:
  push:
    branches: ["chore/bootstrap-authentic-npm-lockfile"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/npm-lockfile-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate authentic workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean lockfile installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to this bootstrap branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date"
            exit 0
          fi
          git commit -m "chore: add npm-generated workspace lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: buildsphere-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
