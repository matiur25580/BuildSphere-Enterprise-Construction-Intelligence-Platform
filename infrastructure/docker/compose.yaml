name: buildsphere-local
services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - buildsphere-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mongosh mongodb://mongodb:27017/admin --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]}).ok }'
  clamav:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - buildsphere-clamav:/var/lib/clamav
    restart: unless-stopped
volumes:
  buildsphere-mongo:
  buildsphere-clamav:
