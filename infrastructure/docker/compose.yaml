name: buildsphere-local
services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - buildsphere-mongo:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch (e) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]});
          }' &&
          mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true
      interval: 5s
      timeout: 8s
      retries: 30
  clamav:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - buildsphere-clamav:/var/lib/clamav
    restart: unless-stopped
volumes:
  buildsphere-mongo:
  buildsphere-clamav:
